<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Utility Application</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="container">

        <h1>
            <i class="fa-solid fa-calculator"></i>
            Array Utility Application
        </h1>

        <div class="input-box">
            <input type="text" id="numbers"
                placeholder="Enter numbers separated by comma (10,20,30)">
        </div>

        <div class="btn-group">

            <button onclick="squareNumbers()">
                <i class="fa-solid fa-square-root-variable"></i>
                Map (Square)
            </button>

            <button onclick="filterEven()">
                <i class="fa-solid fa-filter"></i>
                Filter Even
            </button>

            <button onclick="findSum()">
                <i class="fa-solid fa-plus"></i>
                Reduce (Sum)
            </button>

        </div>

        <div class="result">
            <h3>Result</h3>
            <p id="output">Output will appear here...</p>
        </div>

    </div>

    <script src="index.js"></script>

</body>
</html>
